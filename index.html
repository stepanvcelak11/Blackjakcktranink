function simRound(shoe, bet) {
  const hands = [mkHand([drawFrom(shoe)], bet)];
  const up = drawFrom(shoe); hands[0].cards.push(drawFrom(shoe)); const hole = drawFrom(shoe, false);
  const dealer = [up, hole];
  let wag = bet, net = 0;
  if (up.r === 'A' && shouldInsure(trueCount(shoe))) { const ins = bet / 2; wag += ins; net += isBJ(dealer) ? ins * 2 : -ins; }
  const dBJ = isBJ(dealer), pBJ = isBJ(hands[0].cards);
  if (!dBJ && !pBJ) {
    for (let i = 0; i < hands.length; i++) {
      const h = hands[i];
      if (h.cards.length === 1) h.cards.push(drawFrom(shoe));
      if (h.splitAces) continue;
      for (let guard = 0; guard < 12; guard++) {
        if (score(h.cards) >= 21) break;
        const pair = h.cards.length === 2 && normTen(h.cards[0].r) === normTen(h.cards[1].r);
        const ctx = {
          canDouble: h.cards.length === 2 && !h.splitAces && (!h.fromSplit || settings.das),
          canSplit: pair && hands.length < 4 && !h.splitAces,
          canSurrender: settings.sur && hands.length === 1 && h.cards.length === 2,
          tc: trueCount(shoe), devs: devsOn()
        };
        const a = decide(h.cards.map(c => c.r), up.r, ctx).action;
        if (a === 'S') break;
        if (a === 'H') { h.cards.push(drawFrom(shoe)); continue; }
        if (a === 'D') { wag += h.bet; h.bet *= 2; h.doubled = true; h.cards.push(drawFrom(shoe)); break; }
        if (a === 'SUR') { h.surrendered = true; break; }
        if (a === 'P') {
          wag += h.bet;
          const aces = h.cards[0].r === 'A', second = h.cards.pop();
          h.fromSplit = true; h.splitAces = aces;
          const nh = mkHand([second], h.bet, { fromSplit: true, splitAces: aces });
          hands.splice(i + 1, 0, nh);
          h.cards.push(drawFrom(shoe));
          if (aces) { nh.cards.push(drawFrom(shoe)); break; }
          continue;
        }
      }
    }
  }
  shoe.rc += cv(hole.r);
  const live = hands.some(h => !h.surrendered && score(h.cards) <= 21);
  if (!dBJ && !pBJ && live) while (dealerShouldHit(dealer)) dealer.push(drawFrom(shoe));
  const res = settleHands(hands, dealer);
  let w = 0, l = 0, p = 0;
  res.forEach((r, i) => { net += r.pay - hands[i].bet; if (r.res === 'win' || r.res === 'bj') w++; else if (r.res === 'push') p++; else l++; });
  return { net, wag, w, l, p };
}

async function runSim() {
  if (sim.running) return;
  sim.running = true; sim.result = null; renderMore();
  const N = sim.rounds, unit = settings.unit, spread = sim.spread;
  let shoe = makeShoe();
  let bank = 0, peak = 0, dd = 0, wag = 0, sumSq = 0, w = 0, l = 0, p = 0, units = 0;
  const curve = [[0, 0]], every = Math.max(1, Math.floor(N / 400));
  for (let i = 0; i < N;) {
    const end = Math.min(N, i + 2500);
    for (; i < end; i++) {
      if (shoe.cards.length <= shoe.cut) shoe = makeShoe();
      const u = spread ? betUnits(trueCount(shoe)) : 1;
      const r = simRound(shoe, u * unit);
      bank += r.net; wag += r.wag; units += u;
      sumSq += (r.net / unit) ** 2; w += r.w; l += r.l; p += r.p;
      if (bank > peak) peak = bank;
      if (peak - bank > dd) dd = peak - bank;
      if ((i + 1) % every === 0) curve.push([i + 1, bank]);
    }
    const pr = $('sim-prog'); if (pr) pr.style.width = (i / N * 100) + '%';
    await sleep(0);
  }
  const mean = bank / unit / N, tot = w + l + p;
  sim.result = { rounds: N, spread, net: bank, ev: bank / wag * 100, u100: mean * 100, sd: Math.sqrt(Math.max(0, sumSq / N - mean * mean)), dd, avgBet: units / N, win: w / tot * 100, push: p / tot * 100, loss: l / tot * 100, curve };
  sim.running = false;
  stats.sim.hands += N; saveStats();
  if (currentView === 'more') renderMore();
}

function drawSimChart() {
  const svg = $('sim-svg'); if (!svg) return;
  const pts = sim.result.curve;
  const W = svg.clientWidth || 320, H = 170, pl = 50, pr = 8, pt = 8, pb = 20;
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x1 = Math.max(...xs) || 1, y0 = Math.min(0, ...ys), y1 = Math.max(0, ...ys);
  const span = (y1 - y0) || 1;
  const X = x => pl + x / x1 * (W - pl - pr);
  const Y = y => pt + (1 - (y - y0) / span) * (H - pt - pb);
  const d = pts.map((q, i) => `${i ? 'L' : 'M'}${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join('');
  const col = ys[ys.length - 1] >= 0 ? '#4ade80' : '#f87171';
  const ticks = [y1, (y0 + y1) / 2, y0].map(v => `<text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="9.5" fill="#7d8a9c" font-family="JetBrains Mono">${Math.round(v).toLocaleString('cs-CZ')}</text><line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#263142" stroke-width="1"/>`).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `${ticks}
    <line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#7d8a9c" stroke-dasharray="3 3" stroke-width="1"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${pl}" y="${H - 4}" font-size="9.5" fill="#7d8a9c" font-family="JetBrains Mono">0</text>
    <text x="${W - pr}" y="${H - 4}" font-size="9.5" fill="#7d8a9c" text-anchor="end" font-family="JetBrains Mono">${x1.toLocaleString('cs-CZ')} kol</text>
    <line id="sim-x" y1="${pt}" y2="${H - pb}" stroke="#b4bfcd" stroke-width="1" opacity="0"/>
    <circle id="sim-dot" r="4" fill="${col}" stroke="#151b24" stroke-width="2" opacity="0"/>`;
  const tip = $('sim-tip');
  const move = e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const xv = (mx * W / rect.width - pl) / (W - pl - pr) * x1;
    let best = pts[0]; for (const q of pts) if (Math.abs(q[0] - xv) < Math.abs(best[0] - xv)) best = q;
    const cx = X(best[0]), cy = Y(best[1]);
    $('sim-x').setAttribute('x1', cx); $('sim-x').setAttribute('x2', cx); $('sim-x').setAttribute('opacity', 0.5);
    const dot = $('sim-dot'); dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('opacity', 1);
    tip.style.display = 'block';
    tip.style.left = Math.min(rect.width - 40, Math.max(40, cx * rect.width / W + 10)) + 'px';
    tip.style.top = (cy * rect.height / H + 34) + 'px';
    tip.innerHTML = `Kolo ${best[0].toLocaleString('cs-CZ')}<br><b class="${best[1] >= 0 ? 'pos' : 'neg'}">${moneyS(best[1])}</b>`;
  };
  const leave = () => { tip.style.display = 'none'; $('sim-x').setAttribute('opacity', 0); $('sim-dot').setAttribute('opacity', 0); };
  svg.onpointermove = move; svg.onpointerdown = move; svg.onpointerleave = leave;
}

  ]},
  { group: 'Trenér', items: [
    { key: 'coach', label: 'Okamžitá zpětná vazba poradce', type: 'toggle' },
    { key: 'speed', label: 'Rychlost rozdávání', type: 'seg', options: [['slow', 'Pomalu'], ['normal', 'Normál'], ['fast', 'Rychle']] },
    { key: 'sound', label: 'Zvuky', type: 'toggle' },
    { key: 'haptics', label: 'Vibrace (Android)', type: 'toggle' }
  ]}
];
function openSettings() { renderSettings(); $('sheet').classList.remove('hidden'); }
function closeSettings() { $('sheet').classList.add('hidden'); }
function renderSettings() {
  let html = `<div class="grabber"></div><div style="display:flex;justify-content:space-between;align-items:center"><h3>Nastavení</h3><button class="btn btn-dark" style="padding:7px 14px" onclick="closeSettings()">Hotovo</button></div>`;
  for (const g of SETTINGS_SCHEMA) {
    html += `<div class="sgroup"><div class="label">${g.group}</div>`;
    for (const it of g.items) {
      if (it.type === 'toggle') html += `<div class="sitem"><span>${it.label}</span><button class="switch${settings[it.key] ? ' on' : ''}" onclick="setSetting('${it.key}',${!settings[it.key]})"></button></div>`;
      else if (it.type === 'seg') html += `<div class="sitem col"><span>${it.label}</span><div class="seg">${it.options.map(([v, l], i) => `<button class="${settings[it.key] === v ? 'on' : ''}" onclick="setSettingIdx('${it.key}',${i})">${l}</button>`).join('')}</div></div>`;
      else html += `<div class="sitem"><span>${it.label}</span><select class="sel" onchange="setSetting('${it.key}',this.value)">${it.options.map(([v, l]) => `<option value="${v}" ${settings[it.key] === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
    }
    html += `</div>`;
  }
  html += `<div class="sgroup"><div class="label">Data</div>
    <button class="btn btn-dark" style="width:100%;margin-bottom:6px" onclick="closeSettings();resetBank()">Nový bankroll (1 000 $) a zamíchat</button>
    <button class="btn btn-ghost" style="width:100%;color:#fca5a5;border-color:rgba(239,68,68,.4)" onclick="resetAll()">Vynulovat statistiky, XP a výzvy</button></div>
    <p class="note" style="margin-top:14px;text-align:center">BJ Wiz PRO · trénink bez skutečných peněz</p>`;
  $('sheet-body').innerHTML = html;
}
function setSettingIdx(key, i) {
  const it = SETTINGS_SCHEMA.flatMap(g => g.items).find(x => x.key === key);
  setSetting(key, it.options[i][0]);
}
function setSetting(key, val) {
  settings[key] = val; saveSettings();
  CH = buildCharts();
  if (['decks', 'system', 'pen'].includes(key)) {
    if (game.phase === 'bet' && !game.busy) newShoe(); else game.needsShuffle = true;
  }
  if (key === 'unit' && game.bet && game.bet < val) game.bet = val;
  renderSettings();
  refreshView(false);
}
function resetAll() {
  if (!confirm('Opravdu vynulovat statistiky, XP a výzvy?')) return;
  stats = DEFAULT_STATS(); store('bjwiz3_stats', stats); renderHeader(); refreshView(false); toast('Data vynulována');
}

/* =====================================================================
   NAVIGACE
   ===================================================================== */
let currentView = null;
function showView(v) {
  if (!document.getElementById('view-' + v)) v = 'play';
  const prev = currentView; currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.v === v));
  if (v !== 'drill') clearInterval(drillTimer);
  if (prev === 'count' && v !== 'count') { stopCount(); countAwait = false; $('c-answer').classList.add('hidden'); }
  store('bjwiz3_view', v);
  refreshView(prev !== v);
}
function refreshView(entering) {
  if (currentView === 'play') renderPlay();
  else if (currentView === 'drill') {
    renderDrillFilters();
    if (!drill || forcedDrill || (entering && drillLocked)) nextDrill();
    else if (entering && timerOn) startDrillTimer();
  }
  else if (currentView === 'count') { if (entering) setCountMode(countMode); else renderCountView(); }
  else if (currentView === 'goals') renderGoals();
  else if (currentView === 'more') renderMore();
}

/* =====================================================================
   KLÁVESNICE & DOTYK
   ===================================================================== */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('sheet').classList.contains('hidden')) { if (e.key === 'Escape') closeSettings(); return; }
  if (!$('modal').classList.contains('hidden')) { if (e.key === 'Escape') closeModal(); else if (e.key === 'Enter' && $('m-input')) checkGameCount(); return; }
  const tag = (e.target && e.target.tagName) || '', k = e.key.toLowerCase();
  const map = { h: 'H', s: 'S', d: 'D', p: 'P', r: 'SUR' };
  if (currentView === 'count') {
    if (e.key === 'Enter') { e.preventDefault(); countAwait ? checkCount() : startCount(); }
    else if (e.key === ' ' && countMode === 'DECK' && !countAwait) { e.preventDefault(); deckTap(); }
    else if (e.key === 'ArrowUp' && countAwait) { e.preventDefault(); stepAns(1); }
    else if (e.key === 'ArrowDown' && countAwait) { e.preventDefault(); stepAns(-1); }
    return;
  }
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (currentView === 'drill') {
    if (map[k]) drillAnswer(map[k]);
    else if ((e.key === ' ' || e.key === 'Enter') && drillLocked) { e.preventDefault(); nextDrill(); }
  } else if (currentView === 'play') {
    if (game.phase === 'play' && map[k]) act(map[k]);
    else if (game.phase === 'insurance' && (k === 'y' || k === 'n')) insurance(k === 'y');
    else if (game.phase === 'bet' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); deal(); }
    else if (k === 'i') hint();
  }
});
$('count-felt').addEventListener('pointerdown', deckTap);
window.addEventListener('resize', () => { if (currentView === 'more' && moreTab === 'sim' && sim.result) drawSimChart(); });

/* =====================================================================
   START
   ===================================================================== */
CH = buildCharts();
newShoe(false);
if (!game.bet) game.bet = settings.unit;
renderHeader();
checkGoals();
showView(load('bjwiz3_view') || 'play');
</script>
</body>
</html>
