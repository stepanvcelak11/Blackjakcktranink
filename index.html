<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BJ Wiz PRO">
<meta name="theme-color" content="#07080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>BJ Wiz PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b; --card:#111319; --card2:#191c24; --card3:#232733; --line:#1f232c; --hair:rgba(255,255,255,.06);
  --ink:#eef0f6; --ink2:#9399a8; --muted:#5f6575;
  --lime:#9d8cff; --lime2:#b9adff; --lime-d:#5a4bd6; --olive:#2a2550; --acc-bg:#1a1730;
  --green:#3fcf8e; --green-bg:#11291f; --red:#ff5d6c; --red-bg:#2e1419; --amber:#f5b94a; --blue:#4cc3ff;
  --display:'Space Grotesk','Manrope',sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;background:var(--bg)}
/* iOS 26: fixed kontejner velikosti viewportu nechával dole černý pruh → body není fixed */
body{margin:0;position:relative;width:100%;height:var(--app-h,100%);min-height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;
  font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
@media (display-mode: standalone){body{min-height:100lvh}}
#app{position:absolute;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;overflow:hidden}

/* ---------- VIEWS ---------- */
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + var(--nav-h) + 30px)}
.view::-webkit-scrollbar{display:none}
.view.active{display:flex}
.view > *{flex:none}

/* ---------- FLOATING NAV ---------- */
.nav{position:absolute;z-index:30;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding:0 6px var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(9,10,14,.98);border-top:1px solid var(--hair)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--muted);min-width:0;transition:color .15s}
.nav button::before{content:"";position:absolute;top:-1px;left:50%;width:0;height:2px;border-radius:2px;background:var(--lime);transform:translateX(-50%);transition:width .2s}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav button.on::before{width:28px}
.nav button.on svg{stroke:var(--lime)}
.nav button.on svg .keep{stroke:var(--lime)}

/* ---------- HEADER ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 18px}
.hdr h1{margin:0;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hdr-right{display:flex;align-items:center;gap:6px}
.pstat{display:flex;align-items:center;gap:6px;height:44px;padding:0 13px;border-radius:12px;background:var(--card);border:1px solid var(--hair);font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.pstat small{font-size:13px;font-weight:800}
.hex{width:19px;height:19px;flex:none}
.rbtn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--hair);display:grid;place-items:center;flex:none}
.rbtn svg{width:22px;height:22px;fill:var(--ink2)}
.brandrow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,var(--lime2),var(--lime-d))}
.logo svg{width:20px;height:20px;fill:#0c0b18}
.sub{color:var(--ink2);font-size:15px;margin:-6px 0 18px}
.up{color:var(--green)}.down{color:var(--red)}

/* ---------- GENERIC ---------- */
.box{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:20px;margin-bottom:14px}
.box.tight{padding:6px 20px}
.cap{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.cap .i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink2);display:inline-grid;place-items:center;font-size:11px;letter-spacing:0;text-transform:none;cursor:pointer}
.seg{display:flex;gap:2px;padding:4px;background:var(--card);border:1px solid var(--hair);border-radius:14px;margin-bottom:16px}
.seg button{flex:1;padding:11px 6px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--ink2);white-space:nowrap;min-width:0}
.seg button.on{background:var(--card3);color:var(--ink)}
.seg.in{background:#111113;margin:0 0 14px}
.seg.lime button.on{background:var(--lime);color:#0c0b18}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px;border-radius:14px;font-weight:800;font-size:17px;letter-spacing:.01em;transition:transform .08s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-lime{background:var(--lime);color:#0c0b18;box-shadow:0 8px 24px -10px rgba(157,140,255,.7)}
.btn-lime:disabled{background:var(--olive);color:#6e67a3;box-shadow:none}
.btn-dark{background:var(--card2);border:1px solid var(--hair);color:var(--ink)}
.btn-dark:disabled{opacity:.4}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink2)}
.tag{display:inline-flex;padding:7px 12px;border-radius:10px;border:1px solid var(--line);color:var(--ink2);font-size:13.5px;font-weight:600;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:17px}
.row .d{color:var(--ink2);font-size:14px;margin-top:3px}
.chev{color:var(--ink2);font-size:22px;font-weight:300}
.link{color:var(--lime);font-weight:800;font-size:16px;white-space:nowrap}
.note{color:var(--ink2);font-size:13px;line-height:1.55}
.k-big{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.k-lab{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-top:10px;line-height:1.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;margin-top:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:22px 12px;text-align:center}
.tile .v{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em}
.tile .k{color:var(--ink2);font-size:15px;margin-top:4px}
.pct{width:66px;height:58px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.pct b{font-family:var(--display);font-size:19px;font-weight:700}
.pct span{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.g{color:var(--green)}.l{color:var(--lime)}.r{color:var(--red)}
.sectitle{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 14px}
.sectitle h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.03em}
.sectitle .s{color:var(--ink2);font-weight:700;font-size:15px}
.divider{height:1px;background:var(--line);margin:10px 0 24px}

/* ---------- CARDS ---------- */
.card{--cw:64px;position:relative;flex:none;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.13);background:#fff;color:#111;
  box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 -2px 0 rgba(0,0,0,.08)}
.card.red{color:#e0362f}
.card .rk{position:absolute;top:calc(var(--cw)*.09);left:calc(var(--cw)*.13);font-size:calc(var(--cw)*.42);font-weight:800;letter-spacing:-.05em;line-height:1}
.card .st{position:absolute;left:calc(var(--cw)*.12);bottom:calc(var(--cw)*.14);width:calc(var(--cw)*.42);height:calc(var(--cw)*.42)}
.card .st2{position:absolute;right:calc(var(--cw)*.1);top:calc(var(--cw)*.11);width:calc(var(--cw)*.2);height:calc(var(--cw)*.2);opacity:.9}
.card svg{width:100%;height:100%;display:block;fill:currentColor}
.card.back{background:linear-gradient(150deg,#2b2560,#15122e);box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 0 0 calc(var(--cw)*.05) #0e0c20}
.card.back::after{content:"";position:absolute;inset:calc(var(--cw)*.12);border-radius:calc(var(--cw)*.07);border:1px solid rgba(185,173,255,.45);
  background:radial-gradient(circle,rgba(185,173,255,.22) 1px,transparent 1.5px) 0 0/6px 6px}
.c-xl{--cw:92px}.c-lg{--cw:76px}.c-md{--cw:62px}.c-sm{--cw:52px}.c-xs{--cw:42px}
.fan{display:flex;align-items:flex-start}
.fan .card+.card{margin-left:calc(var(--cw)*-.45)}
.row-cards{display:flex;gap:10px;justify-content:center}
.card.deal{animation:deal .38s cubic-bezier(.2,.85,.25,1) both}
.card.fade{animation:fadeIn .3s ease both}
.card.flip{animation:flip .42s ease both}
@keyframes deal{from{transform:translate3d(140px,-200px,0) rotate(-20deg);opacity:0}}
@keyframes fadeIn{from{transform:translateY(-8px) rotate(-3deg);opacity:0}}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.tilt{transform:rotate(-4deg)}

/* ---------- CHIPS ---------- */
.chip{--c:#d9453d;--s:#fff;--t:#fff;width:58px;height:58px;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle,var(--c) 0 57%,transparent 58%),repeating-conic-gradient(from -11deg,var(--s) 0 22deg,var(--c) 22deg 45deg);
  box-shadow:0 4px 0 rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.45);font-weight:800;font-size:15px;color:var(--t);transition:transform .1s}
.chip::before{content:"";position:absolute;inset:22%;border-radius:50%;border:1.5px dashed rgba(255,255,255,.4)}
.chip span{position:relative}
.chip:active{transform:translateY(-4px) scale(1.04)}
.chip:disabled{opacity:.4}
.chip.v1{--c:#e8e6df;--s:#c9c6bb;--t:#222}.chip.v5{--c:#d9453d}.chip.v10{--c:#3b6fd8}.chip.v25{--c:#24935a}
.chip.v100{--c:#15161c;--s:var(--lime);--t:var(--lime2)}.chip.v500{--c:#8a5cd6;--s:#e9ddff}.chip.v1000{--c:#f5b94a;--s:#7a5410;--t:#1e1405}
.chips{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.stack{position:relative;width:46px;height:46px}
.stack .chip{position:absolute;left:0;top:0;width:46px;height:46px;font-size:12px}

/* ---------- PLAY ---------- */
#view-play{padding:0;overflow:hidden}
.ptop{display:flex;align-items:center;gap:7px;padding:calc(var(--safe-t) + 8px) 10px 10px;background:var(--bg);flex:none;overflow-x:auto;scrollbar-width:none}
.ptop::-webkit-scrollbar{display:none}
.pbox{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--hair);flex:none}
.pbox .k{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--ink2)}
.pbox .v{font-family:var(--display);font-size:16px;font-weight:700;white-space:nowrap}
.pbox svg{width:20px;height:20px;fill:none;stroke:var(--lime);stroke-width:2;flex:none}
.pill-w,.pill-l{height:46px;padding:0 15px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;flex:none;letter-spacing:.04em}
.pill-w{background:var(--card2);color:var(--ink);border:1px solid var(--hair)}.pill-l{background:var(--lime);color:#0c0b18}
.pill-w svg,.pill-l svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
@media (max-width:420px){.ptop .icn{display:none}.pbox{padding:0 10px}.pill-w,.pill-l{padding:0 13px}}
.table{position:relative;flex:1;min-height:0;background:radial-gradient(120% 80% at 50% 0%,#1d1f33 0%,#121422 55%,#0c0d16 100%);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:14px 10px 16px}
.tray{position:absolute;top:12px;left:16px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.tray .tb{width:40px;height:52px;border-radius:9px;background:rgba(0,0,0,.35);position:relative;overflow:hidden}
.tray .tb i{position:absolute;left:4px;right:4px;bottom:4px;border-radius:3px;background:repeating-linear-gradient(0deg,#d4d4d8 0 2px,#7c7c84 2px 3px)}
.tray span,.shoe span{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--ink2);white-space:nowrap}
.shoe{position:absolute;top:0;right:14px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.shoe .sb{width:66px;height:58px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#262a40,#171a2a);box-shadow:0 10px 20px rgba(0,0,0,.5);position:relative}
.shoe .sb i{position:absolute;left:10px;right:10px;bottom:16px;height:5px;border-radius:3px;background:var(--lime);opacity:.8}
.centerinfo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:66px}
.cpill{padding:8px 16px;border-radius:12px;background:rgba(7,8,11,.55);border:1px solid var(--hair);font-weight:700;font-size:14.5px;white-space:nowrap}
.cpill b{color:var(--lime);font-weight:800}
.xray{width:170px;display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px}
.xray i{display:block;height:100%}
.xray-lab{display:flex;gap:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em}
.dealer-zone,.player-zone{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.zlab{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--muted);margin-bottom:8px}
.score{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;background:rgba(7,8,11,.7);border:1px solid var(--hair);font-family:var(--display);font-size:14px;font-weight:700;margin-top:8px;min-height:26px}
.score.bj{background:var(--lime);color:#0c0b18;border-color:transparent}
.score.bust{background:var(--red);border-color:transparent}
.hands{display:flex;justify-content:center;align-items:flex-end;gap:10px;width:100%}
.hand{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 6px 4px;border-radius:16px}
.hand.act{background:rgba(157,140,255,.08);box-shadow:0 0 0 1.5px var(--lime)}
.hand.dim{opacity:.55}
.hfoot{display:flex;align-items:center;gap:7px;margin-top:8px}
.hfoot .score{margin:0}
.bmini{position:relative;width:34px;height:34px;flex:none}
.bmini .stack{position:absolute;left:-6px;top:-6px;transform:scale(.74)}
.amt{font-size:13px;font-weight:800;white-space:nowrap}
.res{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:5;white-space:nowrap;padding:4px 10px;border-radius:9px;font-size:12px;font-weight:800;letter-spacing:.04em;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.res-win{background:var(--green);color:#06210f}.res-bj{background:var(--lime);color:#0c0b18}.res-lose,.res-bust{background:var(--red);color:#fff}.res-push{background:#e4e4e7;color:#111}.res-surrender{background:#52525b;color:#fff}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.betspot{position:relative;width:90px;height:90px;border-radius:50%;border:1.5px solid rgba(185,173,255,.35);box-shadow:inset 0 0 0 6px rgba(157,140,255,.05);display:grid;place-items:center;margin-top:4px}
.betspot .ph{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.betspot .amt{position:absolute;bottom:-22px}
.pbottom{flex:none;background:var(--bg);padding:10px 14px calc(var(--safe-b) + var(--nav-h) + 18px);display:flex;flex-direction:column;gap:10px}
.coach{height:44px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--hair);color:var(--ink2);font-size:13.5px;font-weight:600;line-height:1.35}
.coach.ok{background:var(--green-bg);color:#9cf0c6}
.coach.bad{background:var(--red-bg);color:#ffc0c6}
.coach.info{background:var(--acc-bg);color:var(--lime2)}
.coach span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctl{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:184px}
#mist{position:absolute;z-index:20;left:10px;right:10px;bottom:calc(var(--safe-b) + var(--nav-h) + 14px);max-height:62%;overflow-y:auto;background:var(--card);border:1px solid rgba(255,93,108,.4);border-left:3px solid var(--red);border-radius:16px;padding:18px 18px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.7);animation:up .25s cubic-bezier(.2,.9,.3,1)}
#mist .m-t{font-family:var(--display);font-size:20px;font-weight:700;color:#ff8d98}
#mist .m-s{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:4px}
#mist p{margin:12px 0 16px;font-size:15.5px;line-height:1.55;color:#e4e4e7}
#mist .btn{padding:15px;font-size:17px}
.coach .mini{flex:none;padding:5px 10px;border-radius:8px;background:var(--lime);color:#0c0b18;font-size:12px;font-weight:800}
.modeseg{display:flex;width:72%;margin:0 auto;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--hair)}
.modeseg button{flex:1;padding:8px;border-radius:9px;font-weight:800;font-size:14.5px;letter-spacing:.06em;color:var(--ink2)}
.modeseg button.on{background:var(--card3);color:var(--ink)}
.smallbtns{display:flex;justify-content:center;gap:10px}
.smallbtns button{padding:10px 22px;border-radius:10px;background:var(--card);border:1px solid var(--hair);color:var(--ink2);font-weight:800;font-size:14px;letter-spacing:.08em}
.deal{padding:18px;border-radius:14px;font-size:18px;letter-spacing:.1em}
.betrow{display:grid;grid-template-columns:52px 52px 52px 1fr;gap:8px;align-items:center}
.betrow .ib{height:56px;border-radius:14px;background:var(--card);border:1px solid var(--hair);color:var(--ink2);font-weight:800;font-size:19px}
.betrow .ib:disabled{opacity:.4}
.betrow .deal{padding:0;height:56px;font-size:17px}
.acts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.acts .a{grid-column:span 3;height:58px;border-radius:14px;font-weight:800;font-size:15px;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.acts .a.sm{grid-column:span 2;height:52px;font-size:14px}
.acts .a small{font-size:10.5px;font-weight:700;opacity:.7;letter-spacing:.02em}
.acts .a:disabled{opacity:.3}
.a-hit{background:var(--green);color:#04170e}.a-stand{background:var(--red);color:#fff}.a-dbl{background:var(--lime);color:#0c0b18}.a-split{background:var(--blue);color:#03182a}.a-sur{background:var(--card2);color:var(--ink);border:1px solid var(--hair)}
.acts .a:active:not(:disabled){transform:scale(.97)}
.acts.nosur .a.sm{grid-column:span 3}
#app.playing .nav{display:none}
#app.playing .pbottom{padding-bottom:calc(var(--safe-b) + 12px)}

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const $ = id => document.getElementById(id);
/* iOS (plocha): výška viewportu bývá o stavový řádek menší → dole vznikal prázdný pruh */
function fitViewport() {
  let h = Math.max(window.innerHeight, document.documentElement.clientHeight);
  const ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (ios && standalone) {
    const full = window.matchMedia('(orientation: portrait)').matches ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    if (full > h && full - h <= 120) h = full;
  }
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
fitViewport();
window.addEventListener('resize', fitViewport);
if (window.visualViewport) visualViewport.addEventListener('resize', fitViewport);
window.addEventListener('pageshow', fitViewport); [300, 1200].forEach(t => setTimeout(fitViewport, t));
window.addEventListener('orientationchange', () => setTimeout(fitViewport, 300));
/* po zavření klávesnice iOS viewport nezvětší zpět → vynutit přepočet */
document.addEventListener('focusout', () => setTimeout(() => { fitViewport(); const st = document.body.style; st.display = 'none'; void document.body.offsetHeight; st.display = ''; }, 350));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sgn = n => (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0');
const fmt1 = n => { const v = Math.round(n * 10) / 10; return (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1); };
const money = n => (Math.round(n * 10) / 10).toLocaleString('cs-CZ', { maximumFractionDigits: 1 });
const moneyS = n => (n < 0 ? '−' : '+') + money(Math.abs(n));
const parseNum = v => parseInt(String(v).replace('−', '-'), 10) || 0;
const pct = (a, b) => (b ? Math.round(a / b * 100) : 0);

  return hands.map(h => {
    const p = score(h.cards), pBJ = single && isBJ(h.cards);
    if (h.surrendered) return dBJ && settings.enhc ? { pay: 0, res: 'lose' } : { pay: h.bet / 2, res: 'surrender' };
    if (pBJ && dBJ) return { pay: h.bet, res: 'push' };
    if (pBJ) return { pay: h.bet + h.bet * settings.bjPay, res: 'bj' };
    if (dBJ) return { pay: 0, res: 'lose' };
    if (p > 21) return { pay: 0, res: 'bust' };

}

/* =====================================================================

const RANKS_T = [[0, 'Nováček'], [900, 'Začátečník'], [1100, 'Solidní'], [1300, 'Ostrý'], [1500, 'Expert'], [1700, 'Mistr'], [1900, 'Profík']];
const rankTitle = r => RANKS_T.filter(x => r >= x[0]).pop()[1];
function ratingDelta(ok, n) {
  const acc = ok / n, exp = clamp(.55 + (stats.rating - 1000) / 2000, .5, .92);
  return Math.round(160 * (acc - exp)) + (acc === 1 ? 10 : 0);
}
function weekGain() { const cut = Date.now() - 7 * 864e5; return stats.sessions.filter(s => s.t >= cut).reduce((a, s) => a + s.delta, 0); }
function recordDecision(cellId, ok, dev, chosen, correct) {
  const d = stats.dec, t = today();

  const c = stats.cells[cellId] || (stats.cells[cellId] = { ok: 0, fail: 0 });
  if (ok) { d.ok++; t.ok++; d.streak++; d.best = Math.max(d.best, d.streak); c.ok++; c.st = (c.st || 0) + 1; if (dev) d.dev++; }
  else {

    if (chosen && correct) { const k = correct + '>' + chosen, w = stats.coach.wrong; w[k] = (w[k] || 0) + 1; }
  }
}
function parseCell(id) { const [type, row, dealer] = id.split('_'); return { type, row, dealer }; }
function cellName(id) {
  const { type, row, dealer } = parseCell(id);
  if (type === 'SOFT') return `Soft ${+row + 11} vs ${dealer}`;
  if (type === 'PAIR') return `Pár ${row}-${row} vs ${dealer}`;

}
const SKILLS = [

  { id: 'pairs', name: 'Páry', d: 'Kdy rozdělit', cards: ['8', '8'], test: c => c.type === 'PAIR' },
  { id: 'stiff', name: 'Stiff ruce', d: '12–16, ruce na přetažení', cards: ['K', '6'], test: c => c.type === 'HARD' && +c.row >= 12 && +c.row <= 16 },
  { id: 'doubles', name: 'Zdvojení', d: '9, 10 a 11', cards: ['6', '5'], test: c => c.type === 'HARD' && +c.row >= 9 && +c.row <= 11 },
  { id: 'surr', name: 'Surrender', d: '15 a 16 proti silné kartě', cards: ['10', '6'], needSur: true, test: c => c.type === 'HARD' && (((+c.row === 15 || +c.row === 16) && ['9', '10', 'A'].includes(c.dealer)) || (+c.row === 17 && c.dealer === 'A')) },
  { id: 'index', name: 'Indexy I18', d: 'Odchylky podle True Countu', cards: ['10', '6'], index: true }
];
function skillStats(sk) {
  if (sk.index) { const s = stats.sessions.filter(x => x.skill === 'index'); return { n: s.reduce((a, x) => a + x.n, 0), ok: s.reduce((a, x) => a + x.ok, 0) }; }
  let n = 0, ok = 0;
  for (const id in stats.cells) { const c = parseCell(id); if (c.row === '18') continue; if (sk.test(c)) { n += stats.cells[id].ok + stats.cells[id].fail; ok += stats.cells[id].ok; } }
  return { n, ok };
}
function skillLevel(p, n) {
  if (!n) return ['Nezkoušeno', 'var(--muted)'];
  if (p >= 85) return ['Silná', 'var(--green)'];
  if (p >= 70) return ['Solidní', 'var(--green)'];

function leaks(n = 4) {
  return Object.entries(stats.cells).filter(([id, c]) => c.fail > 0 && !id.includes('_18_'))
    .map(([id, c]) => ({ id, ...c, rate: c.fail / (c.ok + c.fail) }))

}
function dayStreak(dates) {

  while (set.has(dayKey(t))) { s++; t -= 864e5; }

}
const dailyStreak = () => dayStreak(stats.count.daily);
const activeStreak = () => dayStreak(Object.keys(stats.days).filter(k => stats.days[k].n || stats.days[k].drills));

/* =====================================================================

function handForTotal(t) {
  const combos = [];
  for (let a = 2; a <= 10; a++) { const b = t - a; if (b >= 2 && b <= 10 && b !== a) combos.push([String(a), String(b)]); }
  return rand(combos);
}
function cellToHand(id) {
  const { type, row, dealer } = parseCell(id);
  if (type === 'PAIR') return { p1: row, p2: row, dealer };
  if (type === 'SOFT') return { p1: 'A', p2: row, dealer };
  const [p1, p2] = handForTotal(row === '8' ? randInt(5, 8) : +row);
  return { p1, p2, dealer };
}
function randomHand() {
  let p1 = rand(RANKS10), p2 = rand(RANKS10);
  if ((p1 === 'A' && p2 === '10') || (p1 === '10' && p2 === 'A')) p2 = rand(['2','3','4','5','6','7','8','9']);
  return { p1, p2, dealer: rand(RANKS10) };
}
function handForSkill(skill) {
  const dealer = rand(RANKS10);
  switch (skill) {
    case 'hard': { const [a, b] = handForTotal(randInt(8, 17)); return { p1: a, p2: b, dealer }; }
    case 'stiff': { const [a, b] = handForTotal(randInt(12, 16)); return { p1: a, p2: b, dealer }; }
    case 'doubles': { const [a, b] = handForTotal(randInt(9, 11)); return { p1: a, p2: b, dealer }; }
    case 'soft': return { p1: 'A', p2: rand(['2','3','4','5','6','7','8','9']), dealer };
    case 'pairs': { const p = rand(RANKS10); return { p1: p, p2: p, dealer }; }
    case 'surr': { const [t, d] = rand([[16, '9'], [16, '10'], [16, 'A'], [15, '10'], [15, '9'], [15, 'A'], [17, 'A'], [14, '10'], [16, '8'], [15, '8']]); const [a, b] = handForTotal(t); return { p1: a, p2: b, dealer: d }; }
    case 'index': {
      const dv = rand(DEVIATIONS.filter(devOk));
      const [a, b] = dv.pair ? ['10', '10'] : handForTotal(dv.total);
      return { p1: a, p2: b, dealer: dv.up, tc: devIdx(dv) + rand([-3, -2, -1, -1, 0, 0, 1, 1, 2, 3]) };
    }
    default: { const ls = weakCells(8); return (ls.length && Math.random() < .45) ? cellToHand(rand(ls).id) : randomHand(); }
  }
}

let sess = null, cnt = null, cntTimer = null, lesson = null;

}

const RC_SPEEDS = { learning: [1.5, 'Učení'], relaxed: [.9, 'Pohodově'], casino: [.6, 'Kasino'], pro: [.4, 'Profík'] };

function startCount(kind) {
  clearInterval(cvDemoT); clearInterval(cntTimer); sess = null; lesson = null;
  $('overlay').classList.remove('hidden');
  if (kind === 'cv') { cnt = { kind, cards: Array.from({ length: 12 }, () => mkCard(rand(RANKS))), i: 0, ok: 0, run: 0, best: 0, marks: [], locked: false }; renderCv(); }
  else if (kind === 'rc' || kind === 'daily') {
    const n = kind === 'daily' ? 20 : 15, speed = kind === 'daily' ? 'relaxed' : settings.rcSpeed;
    cnt = { kind, n, speed, cards: Array.from({ length: n }, () => mkCard(rand(RANKS))), i: -3, phase: 'run' };
    renderRc(); cntTimer = setInterval(rcTick, Math.max(600, RC_SPEEDS[speed][0] * 1000));
  } else if (kind === 'tc') { cnt = { kind, qs: Array.from({ length: 5 }, genTc), i: 0, ok: 0 }; renderTc(); }
}
function cntTop(i, n, segs) {
  return `<div class="ovtop"><button class="xbtn" onclick="closeOverlay()">✕</button><div class="progsegs">${segs || Array.from({ length: n }, (_, k) => `<i class="${k < i ? 'ok' : k === i ? 'cur' : ''}"></i>`).join('')}</div><div class="ovcount">${Math.min(i + 1, n)}/${n}</div></div>`;
}
function renderCv() {
  const c = cnt, card = c.cards[c.i];
  const vals = [...new Set(Object.values(SYS[settings.system].v))].sort((a, b) => b - a);
  const segs = c.cards.map((_, k) => `<i class="${k < c.i ? (c.marks[k] ? 'ok' : 'bad') : k === c.i ? 'cur' : ''}"></i>`).join('');
  $('overlay').innerHTML = `${cntTop(c.i, c.cards.length, segs)}

    <div class="stage" style="justify-content:center;gap:24px">${cardHTML(card, { size: 'xl', anim: 'fade', cls: 'tilt' })}<div class="fb" id="cv-fb">Jakou hodnotu má karta?</div></div>
    <div class="vbtns" style="grid-template-columns:repeat(${vals.length},1fr)">${vals.map(v => `<button class="vbtn ${v > 0 ? 'p' : v < 0 ? 'm' : ''}" onclick="cvAnswer(${v})">${sgn(v)}</button>`).join('')}</div>`;
}
function cvAnswer(v) {
  const c = cnt; if (!c || c.kind !== 'cv' || c.locked) return;
  c.locked = true;
  const card = c.cards[c.i], right = cv(card.r), ok = v === right;
  c.marks[c.i] = ok;
  if (ok) { c.ok++; c.run++; c.best = Math.max(c.best, c.run); sfx.ok(); } else { c.run = 0; sfx.bad(); }
  const fb = $('cv-fb'); fb.className = 'fb ' + (ok ? 'ok' : 'bad'); fb.textContent = ok ? `✓ ${card.r} = ${sgn(right)}` : `✗ ${card.r} má hodnotu ${sgn(right)}`;
  setTimeout(() => { if (cnt !== c) return; c.i++; c.locked = false; if (c.i < c.cards.length) renderCv(); else finishCv(); }, ok ? 420 : 1100);
}
function finishCv() {
  const c = cnt, n = c.cards.length, p = pct(c.ok, n), pass = p >= 80;
  stats.count.cv.push({ t: Date.now(), n, ok: c.ok, best: c.best }); if (stats.count.cv.length > 100) stats.count.cv.shift();
  if (pass && !stats.count.systems.includes(settings.system)) stats.count.systems.push(settings.system);
  today().drills++; saveStats();
  countSummary(p, `${c.ok} z ${n} správně`, pass ? 'Prošel jsi ✓' : `Na průchod chybí ${Math.ceil(n * .8) - c.ok} správně`, pass, 'cv');
}
function renderRc() {

  $('overlay').innerHTML = `${cntTop(Math.max(0, c.i), c.n)}

}
function rcTick() {

  c.i++;

  if (c.i >= c.n) { clearInterval(cntTimer); c.phase = 'answer'; renderRc(); return; }

}

function rcCheck() {

  c.phase = 'done';
  stats.count.rc.push({ t: Date.now(), n: c.n, ok, diff: v - target, secs, speed: c.speed }); if (stats.count.rc.length > 100) stats.count.rc.shift();

  if (c.kind === 'daily' && !stats.count.daily.includes(dayKey())) stats.count.daily.push(dayKey());
  today().drills++; saveStats();
  ok ? sfx.ok() : sfx.bad();
  countSummary(ok ? 100 : Math.max(0, 100 - Math.abs(v - target) * 20), ok ? `Přesně ${sgn(target)}` : `Tvoje ${sgn(v)} · správně ${sgn(target)}`, ok ? `Perfektní count za ${Math.round(secs)} s` : 'Zkus to znovu, nebo zpomal', ok, c.kind);
}

const DBUST = { 2: 35, 3: 37, 4: 40, 5: 42, 6: 42, 7: 26, 8: 24, 9: 23, 10: 23, A: 17 };

function explain(ranks, up, r, ctx = {}) {

  const { total: t, soft } = scoreRanks(ranks), pair = ranks.length === 2 && normTen(ranks[0]) === normTen(ranks[1]), a = r.action;

    return `Tohle je index — odchylka od základní strategie. Při TC ${fmt1(tc)} zbývá v botě ${tc >= 0 ? 'nadprůměrně' : 'podprůměrně'} desítek a es, takže se vyplatí ${LABEL[a]} místo běžného tahu. (${r.desc.replace(/^Index /, '')})`;
  }
  if (settings.enhc && (d === '10' || d === 'A') && ((pair && (k0(ranks) === 'A' || k0(ranks) === '8') && a !== 'P') || (!pair && !soft && t === 11 && a === 'H')))
    return `Evropské pravidlo bez skryté karty: dealer s ${d} ještě může mít blackjack (asi v ${d === 'A' ? 31 : 8} % případů) a pak bys přišel i o ${t === 11 ? 'zdvojenou' : 'rozdělenou'} sázku. Proto tady ${t === 11 ? 'nezdvojuješ' : 'nedělíš'}, ale jen ${LABEL[a] === 'HIT' ? 'táhneš' : LABEL[a]}.`;
  if (a === 'SUR') return `${soft ? 'Soft' : 'Hard'} ${t} proti ${d} je tak špatná ruka, že při hraní dlouhodobě ztratíš víc než polovinu sázky (${dw}). Vzdáním přijdeš přesně o 50 % — to je menší ztráta.`;
  const k = pair ? normTen(ranks[0]) : null;
  if (pair && a === 'P') {
    if (k === 'A') return 'Dvě esa jsou jen soft 12. Rozdělením začínáš dvě ruce esem a každá může skončit na 21. Esa se dělí vždy.';
    if (k === '8') return '8,8 je 16 — nejhorší ruka ve hře. Dvě ruce začínající osmičkou mají mnohem lepší vyhlídky, proto osmičky dělíš.';
    if (k === '9') return `18 proti ${d} často nestačí, ale dvě ruce začínající devítkou jsou silné — ${dw}.`;
    return `${weak ? 'Slabá karta dealera: ' : ''}${dw}. Dvě ruce začínající ${k} vydělají víc než jedna ${soft ? 'soft' : 'hard'} ${t}.${CH.PAIR[k][di] === 'YN' ? ' Platí jen díky DAS (zdvojení po splitu).' : ''}`;
  }
  if (pair && k === '10') return '10,10 je 20 — skoro jistá výhra. Rozdělením bys výbornou ruku rozbil na dvě průměrné.';
  const pre = pair ? (k === '5' ? 'Pětky nedělíš — 5,5 hraj jako hard 10. ' : `Pár ${k},${k} proti ${d} se nedělí — hraj ho jako ${soft ? 'soft' : 'hard'} ${t}. `) : '';

    if (a === 'H') return pre + (t >= 18 ? `Proti ${d} dealer často skončí na 19–20, takže soft ${t} by prohrála. Eso se může přepočítat na 1, takže kartou nic neriskuješ.` : `Soft ${t} jednou kartou nepřetáhneš — eso se přepočítá na 1. Ruka je slabá, tak ji vylepši.`) + noDbl;
    return pre + (t >= 19 ? `Soft ${t} je silná ruka — stůj.` : `Soft ${t} proti ${d} stačí: ${dw}.`) + noDbl;
  }
  if (a === 'D') return pre + `S ${t} máš velkou šanci dostat desítku a skončit na ${t + 10}.${weak ? ` Navíc ${dw}.` : ''} V takové výhodě se vyplatí zdvojit sázku.`;
  if (a === 'H') {
    if (t <= 11) return pre + `S ${t} nemůžeš přetáhnout — vždy si vezmi kartu.${noDbl || (t >= 9 ? ` Proti ${d} ale nemáš dost velkou výhodu na zdvojení.` : '')}`;
    if (weak) return pre + `Hard ${t} přetáhneš jen v ${pBust(t)} % případů a dealer s ${d} přetahuje jen asi v ${b} % — ruku se vyplatí vylepšit.`;
    return pre + `${dw[0].toUpperCase() + dw.slice(1)}. Kdybys stál na ${t}, prohrál bys skoro pokaždé, když nepřetáhne. Proto riskuješ kartu (přetáhneš v ${pBust(t)} %).${r.desc.includes('surrender') ? ' Surrender už nejde.' : ''}`;
  }
  if (a === 'S') {
    if (t >= 17) return pre + `${t} je dost — další karta by tě přetáhla v ${pBust(t)} % případů.`;
    return pre + `Dealer s ${d} je slabý a přetáhne asi v ${b} % případů. Tvoje ${t} by další kartou přetáhla v ${pBust(t)} % — nech riskovat dealera.`;
  }

}

function refreshSim() { const a = $('sim-area'); if (a) { a.innerHTML = simHTML(); if (sim.result) drawSimChart(); } }
function simRound(shoe, bet) {
  const hands = [mkHand([drawFrom(shoe)], bet)];

  const dealer = [up, hole];

  if (up.r === 'A' && shouldInsure(trueCount(shoe))) { const ins = bet / 2; wag += ins; net += isBJ(dealer) ? ins * 2 : -ins; }
  const dBJ = isBJ(dealer), pBJ = isBJ(hands[0].cards);
  if (!(dBJ && !settings.enhc) && !pBJ) {
    for (let i = 0; i < hands.length; i++) {
      const h = hands[i];
      if (h.cards.length === 1) h.cards.push(drawFrom(shoe));
      if (h.splitAces) continue;
      for (let guard = 0; guard < 12; guard++) {
        if (score(h.cards) >= 21) break;
        const pair = h.cards.length === 2 && normTen(h.cards[0].r) === normTen(h.cards[1].r);
        const a = decide(h.cards.map(c => c.r), up.r, {
          canDouble: h.cards.length === 2 && !h.splitAces && (!h.fromSplit || settings.das),

          tc: trueCount(shoe), devs: devsOn()

        if (a === 'D') { wag += h.bet; h.bet *= 2; h.doubled = true; h.cards.push(drawFrom(shoe)); break; }

          if (aces) { nh.cards.push(drawFrom(shoe)); break; }
        }
      }
    }
  }
  shoe.rc += cv(hole.r);
  if (!dBJ && !pBJ && hands.some(h => !h.surrendered && score(h.cards) <= 21)) while (dealerShouldHit(dealer)) dealer.push(drawFrom(shoe));

}
async function runSim() {
  if (sim.running) return;

  const curve = [[0, 0]], every = Math.max(1, Math.floor(N / 400));
  for (let i = 0; i < N;) {
    const end = Math.min(N, i + 2500);
    for (; i < end; i++) {

      if (bank > peak) peak = bank;

}
function drawSimChart() {
  const svg = $('sim-svg'); if (!svg) return;
  const pts = sim.result.curve, W = svg.clientWidth || 320, H = 170, pl = 52, pr = 8, pt = 8, pb = 20;
  const ys = pts.map(q => q[1]), x1 = pts[pts.length - 1][0] || 1, y0 = Math.min(0, ...ys), y1 = Math.max(0, ...ys), span = (y1 - y0) || 1;
  const X = x => pl + x / x1 * (W - pl - pr), Y = y => pt + (1 - (y - y0) / span) * (H - pt - pb);
  const d = pts.map((q, i) => `${i ? 'L' : 'M'}${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join('');
  const col = ys[ys.length - 1] >= 0 ? '#3fcf8e' : '#ff5d6c';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = [y1, (y0 + y1) / 2, y0].map(v => `<text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="#9399a8">${Math.round(v).toLocaleString('cs-CZ')}</text><line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f2321"/>`).join('') +
    `<line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#5f6575" stroke-dasharray="3 3"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <text x="${W - pr}" y="${H - 4}" font-size="10" fill="#9399a8" text-anchor="end">${x1.toLocaleString('cs-CZ')} kol</text>
    <line id="sim-x" y1="${pt}" y2="${H - pb}" stroke="#9399a8" opacity="0"/><circle id="sim-dot" r="4" fill="${col}" stroke="#111319" stroke-width="2" opacity="0"/>`;
  const tip = $('sim-tip');
  svg.onpointermove = svg.onpointerdown = e => {
    const rect = svg.getBoundingClientRect(), xv = ((e.clientX - rect.left) * W / rect.width - pl) / (W - pl - pr) * x1;
    let best = pts[0]; for (const q of pts) if (Math.abs(q[0] - xv) < Math.abs(best[0] - xv)) best = q;
    const cx = X(best[0]), cy = Y(best[1]);
    $('sim-x').setAttribute('x1', cx); $('sim-x').setAttribute('x2', cx); $('sim-x').setAttribute('opacity', .5);
    const dot = $('sim-dot'); dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('opacity', 1);
    tip.style.display = 'block'; tip.style.left = clamp(cx * rect.width / W, 50, rect.width - 50) + 'px'; tip.style.top = (cy * rect.height / H + 30) + 'px';
    tip.innerHTML = `Kolo ${best[0].toLocaleString('cs-CZ')}<br><b class="${best[1] >= 0 ? 'up' : 'down'}">${moneyS(best[1])}</b>`;
  };
  svg.onpointerleave = () => { tip.style.display = 'none'; $('sim-x').setAttribute('opacity', 0); $('sim-dot').setAttribute('opacity', 0); };
}

function parseHandQ(q) {
  const s = q.toLowerCase().replace(/eso|esa|ace/g, 'a').replace(/[,;+]/g, ' ').replace(/\s+/g, ' ');

  const card = t => { t = t.toUpperCase(); return 'JQK'.includes(t) ? '10' : t; };
  if ((mm = p.match(/soft\s*(1[3-9]|20)/))) ranks = ['A', String(+mm[1] - 11)];
  else if ((mm = p.match(/(?:pár|par|pair)\s*(10|[2-9]|a|j|q|k)/))) ranks = [card(mm[1]), card(mm[1])];
  else if ((mm = p.match(/\b(10|[2-9]|a|j|q|k)\s*(10|[2-9]|a|j|q|k)\b\s*$/))) ranks = [card(mm[1]), card(mm[2])];
  else if ((mm = p.match(/\ba\s*([2-9]|10)\b/))) ranks = ['A', mm[1]];
  else if ((mm = p.match(/(?:hard\s*)?\b([5-9]|1[0-9]|20)\b/))) { const t = +mm[1]; if (t <= 11) ranks = t === 11 ? ['6', '5'] : t === 10 ? ['6', '4'] : ['3', String(t - 3)]; else ranks = handForTotal(t) || ['10', String(t - 10)]; }

}

  { id: 'ws5', ic: '📈', t: 'Šňůra', d: 'Vyhraj 5 kol v řadě', g: 5, p: () => stats.game.winStreakMax },
  { id: 'b2k', ic: '💵', t: 'Zdvojnásob', d: '2 000 žetonů', g: 2000, p: () => Math.min(stats.game.maxBank, 2000) },
  { id: 'ins', ic: '🛡', t: 'Pojišťovák', d: '10× správně u pojištění', g: 10, p: () => stats.game.insOk },
  { id: 'sim', ic: '🤖', t: 'Analytik', d: 'Simuluj 100 000 kol', g: 100000, p: () => Math.min(stats.sim.rounds, 100000) },
  { id: 'l5', ic: '🎓', t: 'Pravidla v malíčku', d: 'Dokonči 5 lekcí', g: 5, p: () => stats.lessons.length },
  { id: 'l12', ic: '🎓', t: 'Strategik', d: 'Dokonči 12 lekcí', g: 12, p: () => stats.lessons.length },
  { id: 'l22', ic: '🎓', t: 'Absolvent', d: 'Dokonči všech 22 lekcí', g: 22, p: () => stats.lessons.length }
];
function checkGoals() {
  let any = false;
  for (const g of GOALS) if (!stats.done.includes(g.id) && g.p() >= g.g) { stats.done.push(g.id); toast(`🏆 ${g.t}`); any = true; }
  if (any) store('bjwiz4_stats', stats);
}

/* =====================================================================
   NASTAVENÍ (SHEET)
   ===================================================================== */
const PRESETS = [
  { id: 'eu', name: 'Evropské kasino', d: 'Jako ve většině českých a evropských kasin: 6 balíčků, dealer stojí na soft 17, bez surrenderu, dealer si druhou kartu bere až po tobě.', s: { decks: 6, h17: false, das: true, sur: false, enhc: true, bjPay: 1.5, insurance: true } },
  { id: 'vegas', name: 'Las Vegas', d: '6 balíčků, dealer táhne na soft 17 a hned nahlíží pod kartu na blackjack, late surrender povolen.', s: { decks: 6, h17: true, das: true, sur: true, enhc: false, bjPay: 1.5, insurance: true } },
  { id: 'basic', name: 'Jen základní strategie', d: 'Evropská pravidla a nic navíc: bez surrenderu, bez pojištění, bez počítání karet a indexů. Ideální začátek.', s: { decks: 6, h17: false, das: true, sur: false, enhc: true, bjPay: 1.5, insurance: false, showCount: false, deviations: false } }
];
const RULE_KEYS = ['decks', 'h17', 'das', 'sur', 'enhc', 'bjPay', 'insurance', 'showCount', 'deviations'];
function applyPreset(id) {
  const pr = PRESETS.find(x => x.id === id); if (!pr) return;
  Object.assign(settings, { showCount: true, deviations: true }, pr.s, { style: id, styleSet: true });
  saveSettings(); CH = buildCharts();
  if (game.phase === 'bet' && !game.busy) newShoe(false); else game.needsShuffle = true;
  stats.coach.plan = null;
  if (sheetKind === 'settings') renderSettings();
  refreshView(); toast(`Styl: ${pr.name}`);
}
function presetsHTML(onPick) {
  return PRESETS.map(pr => `<button class="preset${settings.style === pr.id ? ' on' : ''}" onclick="${onPick}('${pr.id}')"><span class="rd"></span><span><b>${pr.name}</b><span class="sdesc">${pr.d}</span></span></button>`).join('')
    + (settings.style === 'custom' ? `<div class="preset on" style="cursor:default"><span class="rd"></span><span><b>Vlastní</b><span class="sdesc">Pravidla sis upravil níže.</span></span></div>` : '');
}
function openStylePicker() {
  openModal(`<h3>Jak chceš hrát?</h3><p>Vyber pravidla, která znáš z kasina. Strategie, trénink i kouč se jim přizpůsobí. Kdykoli to změníš v nastavení stolu.</p>
    <div style="text-align:left">${presetsHTML('pickStyleFirst')}</div>
    <button class="btn btn-dark" style="font-size:15px;padding:14px" onclick="settings.styleSet=true;saveSettings();closeModal();openSettings()">Nastavit podrobně</button>`);
}
function pickStyleFirst(id) { closeModal(); applyPreset(id); }
const SCHEMA = [
  { group: 'Pravidla stolu', items: [
    { key: 'decks', label: 'Počet balíčků', type: 'seg', options: [[4, '4'], [6, '6'], [8, '8']] },
    { key: 'h17', label: 'Dealer na soft 17', desc: 'Táhne (H17) je běžné v USA, stojí (S17) v Evropě. S17 je pro tebe o ~0,2 % lepší.', type: 'seg', options: [[true, 'Táhne (H17)'], [false, 'Stojí (S17)']] },
    { key: 'enhc', label: 'Dealer bez skryté karty', desc: 'Evropské pravidlo: dealer si druhou kartu bere až po tobě. Když pak má blackjack, prohráváš i zdvojené a rozdělené sázky — proto se proti 10 a esu méně zdvojuje a dělí.', type: 'toggle' },
    { key: 'bjPay', label: 'Výplata blackjacku', desc: '6 : 5 je past — přidává kasinu skoro 1,4 %.', type: 'seg', options: [[1.5, '3 : 2'], [1.2, '6 : 5']] },
    { key: 'das', label: 'Double po splitu (DAS)', desc: 'Můžeš zdvojit i ruku vzniklou rozdělením páru. Ve většině kasin ano.', type: 'toggle' },
    { key: 'sur', label: 'Surrender (vzdání)', desc: 'Vzdáš ruku a dostaneš zpět polovinu sázky. V Česku a většině Evropy obvykle nejde — když ho vypneš, tlačítko zmizí a strategie se přepočítá.', type: 'toggle' },
    { key: 'insurance', label: 'Nabízet pojištění', desc: 'Když dealer ukazuje eso. Bez počítání karet ho nikdy neber; když ho nechceš řešit, vypni.', type: 'toggle' },
    { key: 'pen', label: 'Penetrace boty', desc: 'Kolik boty se rozdá před mícháním. Vyšší = víc šancí pro počítače.', type: 'seg', options: [[.65, '65 %'], [.75, '75 %'], [.85, '85 %']] },
    { key: 'unit', label: 'Jednotka sázky (rada poradce)', type: 'seg', options: [[5, '5'], [10, '10'], [25, '25']] }
  ]},
  { group: 'Počítání', items: [
    { key: 'system', label: 'Systém', type: 'system' },
    { key: 'showCount', label: 'Ukazovat RC/TC a X-ray u stolu', desc: 'Vypni, až budeš chtít počítat sám a jen si to ověřovat.', type: 'toggle' },
    { key: 'deviations', label: 'Indexy I18 + Fab 4 (Hi-Lo)', desc: 'Odchylky od základní strategie podle true countu. Zapni až po zvládnutí základní strategie.', type: 'toggle' }
  ]},
  { group: 'Aplikace', items: [
    { key: 'coach', label: 'Zpětná vazba a vysvětlení chyb', type: 'toggle' },
    { key: 'speed', label: 'Rychlost rozdávání', type: 'seg', options: [['slow', 'Pomalu'], ['normal', 'Normál'], ['fast', 'Rychle']] },
    { key: 'sound', label: 'Zvuky', type: 'toggle' },
    { key: 'haptics', label: 'Vibrace (Android)', type: 'toggle' }
  ]}
];
function openSettings() { sheetKind = 'settings'; renderSettings(); }
function renderSettings() {
  const lab = it => `<span>${it.label}${it.desc ? `<span class="sdesc">${it.desc}</span>` : ''}</span>`;
  let h = `<div style="display:flex;justify-content:space-between;align-items:center"><h3>Nastavení</h3><button class="tag" onclick="closeSheet()">Hotovo</button></div>
    <div class="sg"><div class="cap">Styl hry</div>${presetsHTML('applyPreset')}</div>`;
  for (const g of SCHEMA) {
    h += `<div class="sg"><div class="cap">${g.group}</div>`;
    for (const it of g.items) {
      if (it.type === 'toggle') h += `<div class="si">${lab(it)}<button class="sw${settings[it.key] ? ' on' : ''}" onclick="setSetting('${it.key}',${!settings[it.key]})"></button></div>`;
      else if (it.type === 'seg') h += `<div class="si col" style="gap:10px">${lab(it)}<div class="seg">${it.options.map(([v, l], i) => `<button class="${settings[it.key] === v ? 'on' : ''}" onclick="setSettingIdx('${it.key}',${i})">${l}</button>`).join('')}</div></div>`;
      else h += `<button class="si" style="width:100%" onclick="pickSystem()"><span>${it.label}<span class="sdesc">Jak systémy fungují, výhody a nevýhody</span></span><b class="l">${SYS[settings.system].name} ›</b></button>`;
    }
    h += '</div>';
  }
  h += `<div class="sg"><div class="cap">Ostatní</div><button class="btn btn-dark" style="margin-bottom:8px;font-size:15px;padding:14px" onclick="openChart()">Tabulka strategie</button>
    <button class="btn btn-ghost" style="font-size:15px;padding:14px;color:#ff8d98" onclick="resetAll()">Vynulovat všechna data</button></div>`;
  openSheet(h);
}
function setSettingIdx(key, i) { setSetting(key, SCHEMA.flatMap(g => g.items).find(x => x.key === key).options[i][0]); }
function setSetting(key, val) {
  settings[key] = val;
  if (RULE_KEYS.includes(key)) { settings.style = 'custom'; for (const pr of PRESETS) if (Object.entries(Object.assign({ showCount: true, deviations: true }, pr.s)).every(([k, v]) => settings[k] === v)) settings.style = pr.id; stats.coach.plan = null; }
  saveSettings(); CH = buildCharts();
  if (['decks', 'system', 'pen', 'enhc'].includes(key)) { if (game.phase === 'bet' && !game.busy) newShoe(false); else game.needsShuffle = true; }
  if (sheetKind === 'settings') renderSettings();
  refreshView();
}

function resetAll() {
  if (!confirm('Opravdu smazat rating, statistiky, lekce a úspěchy?')) return;
  stats = DEFAULT_STATS(); stats.ratingHist.push({ t: Date.now(), r: 1000 }); store('bjwiz4_stats', stats); closeSheet(); refreshView(); toast('Data vynulována');
}

/* =====================================================================
   NAVIGACE
   ===================================================================== */
let currentView = null, prevView = 'train';
function leavePlay() { if (game.busy) return; hideMistake(); showView(prevView); }
function showView(v) {
  if (!$('view-' + v)) v = 'train';
  if (v !== 'play') prevView = v;
  currentView = v;
  $('app').classList.toggle('playing', v === 'play');
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v !== 'drills') clearInterval(cvDemoT);
  store('bjwiz4_view', v);
  refreshView();
  if (v !== 'play') $('view-' + v).scrollTop = 0;
}
function refreshView() {
  if (currentView === 'train') renderTrain();
  else if (currentView === 'drills') renderDrills();
  else if (currentView === 'play') renderPlay();
  else if (currentView === 'learn') renderLearn();
  else if (currentView === 'stats') renderStats();
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && e.target.id === 'ask-in') return;
  if (!$('modal').classList.contains('hidden')) { if (e.key === 'Escape') closeModal(); else if (e.key === 'Enter' && $('m-in')) checkGameCount(); return; }
  if (!$('sheet').classList.contains('hidden')) { if (e.key === 'Escape') closeSheet(); return; }
  const k = e.key.toLowerCase(), map = { h: 'H', s: 'S', d: 'D', p: 'P', r: 'SUR' };
  if (!$('overlay').classList.contains('hidden')) {
    if (e.key === 'Escape') { closeOverlay(); return; }
    if (sess && sess.res && sess.i < sess.hands.length) { if (map[k]) sessAnswer(map[k]); else if (e.key === 'Enter') sessNext(); }
    else if (cnt && e.key === 'Enter') { if (cnt.kind === 'tc') { cnt.answered ? tcNext() : tcCheck(); } else if (cnt.phase === 'answer') rcCheck(); }
    return;
  }
  if (currentView === 'play') {
    if (!$('mist').classList.contains('hidden')) { if (e.key === 'Enter' || e.key === 'Escape' || e.key === ' ') { e.preventDefault(); hideMistake(); } return; }
    if (game.phase === 'play' && map[k]) act(map[k]);
    else if (game.phase === 'insurance' && (k === 'y' || k === 'n')) insurance(k === 'y');
    else if (game.phase === 'bet' && e.key === 'Enter') deal();
  }
});

/* =====================================================================
   START
   ===================================================================== */
CH = buildCharts();
newShoe(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
showView(load('bjwiz4_view') || 'train');
if (!settings.styleSet) setTimeout(openStylePicker, 400);
</script>
</body>
